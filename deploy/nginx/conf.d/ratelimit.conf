# Rate-limit zones for api.yardmate.ai (referenced by the vhost's location).
# 10m of shared memory ≈ 160k distinct client IPs tracked.
#
# LOOSE BY DESIGN. The precise memory/cost bounds live in the Go app
# (inflight semaphore = 30 concurrent, per-IP 600/h, per-device 100/h). These
# nginx caps are a cheap outer shield that only bites volumetric floods
# (thousands of req/s from one IP) before they reach the app — set generous so
# real shared-NAT / carrier-NAT users never trip them.
limit_req_zone  $binary_remote_addr zone=api_rl:10m   rate=30r/s;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

# /ops/ 是运维动作入口（告警邮件里的按钮），跟 API 流量的取舍完全相反：
# 正常使用频率是「一天零次，出事时点几下」，所以卡得极紧。签名 + 一次性
# token 已经挡住伪造，这道限流是防有人拿着过期链接暴力试签名。
limit_req_zone  $binary_remote_addr zone=ops_rl:1m    rate=1r/s;
